<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}"><img class="brand-logo" src="{{ "favicon.svg" | relURL }}" alt="香港身份 HKID 之旅">香港身份 HKID 之旅</a>
    <nav class="site-nav" id="siteNav">
      <a href="{{ "/" | relURL }}">首页</a>
      <a href="{{ "/posts/" | relURL }}">文章</a>
      <a href="{{ "/about/" | relURL }}">关于</a>
    </nav>
    <button class="menu-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false" aria-controls="siteNav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<script>
(function(){
  var btn = document.getElementById('menuBtn'),
      nav = document.getElementById('siteNav');
  btn.addEventListener('click', function(){
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && nav.classList.contains('open')) {
      nav.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
