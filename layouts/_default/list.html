{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
<div class="page-content">{{ .Content }}</div>
<ul class="post-list">
{{ range .Pages.ByDate.Reverse }}
  <li>
    <time>{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
{{ end }}
</ul>
{{ end }}
