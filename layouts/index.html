{{ define "main" }}
<section class="hero">
  <h1>hk-id 的香港身份之旅</h1>
  <p class="tagline">从非永居走向永居 —— 记录所经历的，所思考的，所想象的，所计划的，以及它们变成现实的样子。</p>
</section>

<section class="timeline">
  <h2>时间线</h2>
  {{ range first 30 (where .Site.RegularPages "Section" "posts") }}
  <article class="tl-item">
    <time>{{ .Date.Format "2006-01-02" }}</time>
    <div class="tl-body">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p>{{ .Summary }}</p>
    </div>
  </article>
  {{ else }}
  <p class="empty">第一篇文章正在路上……</p>
  {{ end }}
</section>
{{ end }}
